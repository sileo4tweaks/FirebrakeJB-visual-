name: Build IPA

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA for SideStore
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode.app

      - name: Print environment
        run: |
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Build .app (unsigned)
        run: |
          mkdir -p build
          xcodebuild \
            -project FirebreakJBKawaii.xcodeproj \
            -scheme FirebreakJBKawaii \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            -allowProvisioningUpdates \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build \
            | tee build/build.log

          echo "=== Build products ==="
          find build/DerivedData/Build/Products -name "FirebreakJBKawaii.app" -maxdepth 4

      - name: Package IPA
        run: |
          APP_PATH=$(find build/DerivedData/Build/Products -name "FirebreakJBKawaii.app" -maxdepth 4 | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: FirebreakJBKawaii.app not found" >&2
            exit 1
          fi
          echo "Found .app at: $APP_PATH"

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          rm -rf "Payload/FirebreakJBKawaii.app/_CodeSignature"
          find Payload/FirebreakJBKawaii.app -name "_CodeSignature" -type d -exec rm -rf {} + 2>/dev/null || true

          rm -f FirebreakJBKawaii.ipa
          zip -qry FirebreakJBKawaii.ipa Payload/

          echo "=== IPA contents ==="
          unzip -l FirebreakJBKawaii.ipa | head -20
          echo ""
          ls -lh FirebreakJBKawaii.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FirebreakJBKawaii-ipa
          path: FirebreakJBKawaii.ipa
          retention-days: 90
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/build.log
          retention-days: 7
          if-no-files-found: ignore

  release:
    name: Publish release on tag
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: FirebreakJBKawaii-ipa

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: FirebreakJBKawaii.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
