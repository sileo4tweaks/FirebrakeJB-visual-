name: FirebreakJBKawaii
options:
  bundleIdPrefix: app.firebreak
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: FirebreakJBKawaii/Info.plist
    PRODUCT_BUNDLE_IDENTIFIER: app.firebreak.kawaii
    PRODUCT_NAME: FirebreakJBKawaii
    MARKETING_VERSION: "3.0.1"
    CURRENT_PROJECT_VERSION: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_PREVIEWS: YES
    DEAD_CODE_STRIPPING: YES
    STRIP_INSTALLED_PRODUCT: YES

targets:
  FirebreakJBKawaii:
    type: application
    platform: iOS
    sources:
      - path: FirebreakJBKawaii
        excludes:
          - "Info.plist"
    resources:
      - path: FirebreakJBKawaii/Assets.xcassets
    info:
      path: FirebreakJBKawaii/Info.plist
      properties:
        CFBundleDisplayName: Firebreak ♥
        UILaunchScreen:
          UIColorName: AccentColor
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.firebreak.kawaii

schemes:
  FirebreakJBKawaii:
    build:
      targets:
        FirebreakJBKawaii: all
    run:
      config: Debug
    test:
      config: Debug
      targets: []
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
